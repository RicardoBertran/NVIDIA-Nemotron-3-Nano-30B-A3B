version = 1

[NVIDIA-Nemotron-3-Nano-30B-A3B]
; Sustituye por la ruta COMPLETA al archivo .gguf, sin comillas.
model = PEGA_AQUI_LA_RUTA_DE_TU_MODELO

; Contexto y salida
ctx-size = 32768
n-predict = -1
reasoning-budget = -1

; Muestreo
temp = 1.0
top-p = 0.95
frequency-penalty = 0
presence-penalty = 0
repeat-penalty = 1.0

; Procesamiento
batch-size = 512
ubatch-size = 128
parallel = 1

; Atencion y cache KV
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0

; GPU y ajuste de memoria
device = CUDA0,CUDA1
n-gpu-layers = auto
split-mode = layer
fit = on
fit-target = 1024,256

; Sin speculative decoding ni MTP ni modelo draft
spec-type = none

; Cache de prompts, sin proyector multimodal, metricas
cache-prompt = on
no-mmproj = true
metrics = true
